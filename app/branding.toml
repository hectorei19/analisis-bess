# ─────────────────────────────────────────────────────────────────────────────
# Marca de la web: ÚNICO archivo a tocar para cambiar nombre, logo y colores.
# Todo vacío = web sin marca.
# ─────────────────────────────────────────────────────────────────────────────

[company]
# Nombre que aparece en la pestaña del navegador y en la portada. Vacío = ninguno.
name = ""
# Ruta relativa a la carpeta app/ (p. ej. "assets/logo.png"). Vacío = sin logo.
logo = ""
# Enlace de la llamada a la acción (p. ej. "mailto:..." o una web de contacto).
# Vacío = no se muestra la llamada a la acción.
contact_url = ""

[colors]
primary = "#2a78d6"

# Colores de las series de los gráficos, en este orden fijo.
# Paleta validada para daltonismo; si se cambia, conviene revalidarla.
series = ["#2a78d6", "#eb6834", "#1baf7a"]
